; PlatformIO Project Configuration File for ESP32 Device Manager
; Climate Pro - OS (Stage Climatisation MLCT)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Configuration automatique du port COM (Recherche dynamique de la carte ESP32 / CH340 / CP210x)
extra_scripts = pre:detect_port.py
; upload_port et monitor_port sont maintenant resolus dynamiquement par detect_port.py

; Configuration du moniteur serie
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 115200

; Systeme de fichiers LittleFS & Partitionnement 4MB (2MB App / 2MB LittleFS)
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Dependances requises
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.2.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; Options de compilation C++17 et optimisation réseau AsyncTCP
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    -D WS_MAX_QUEUED_MESSAGES=32


